<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
    <defs>
      <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E2B193" />
        <stop offset="100%" stop-color="#CA9778" />
      </linearGradient>
      <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#18181B" />
        <stop offset="100%" stop-color="#09090B" />
      </linearGradient>
      <linearGradient id="glasses" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FACC15" />
        <stop offset="100%" stop-color="#CA8A04" />
      </linearGradient>
    </defs>
    <!-- Silhouette / Stylized Portrait Cutout -->
    <g transform="translate(50, 40)">
      <!-- Torso / Shoulders -->
      <path d="M100 560 C120 440, 180 400, 250 390 C320 400, 380 440, 400 560 Z" fill="url(#shirt)" />
      <!-- Neck -->
      <path d="M215 320 L285 320 L290 410 L210 410 Z" fill="url(#skin)" />
      <!-- Head -->
      <ellipse cx="250" cy="270" rx="90" ry="115" fill="url(#skin)" />
      <!-- Hair -->
      <path d="M150 240 C150 160, 200 130, 260 130 C330 130, 360 170, 355 240 C340 210, 320 180, 250 180 C180 180, 160 210, 150 240 Z" fill="#18181B" />
      <path d="M145 220 C140 180, 170 140, 220 130 C270 120, 340 130, 360 190 C350 170, 320 150, 260 150 C200 150, 160 180, 145 220 Z" fill="#27272A" />
      <!-- Minimalist Glasses -->
      <rect x="180" y="240" width="55" height="40" rx="8" fill="none" stroke="url(#glasses)" stroke-width="6" />
      <rect x="265" y="240" width="55" height="40" rx="8" fill="none" stroke="url(#glasses)" stroke-width="6" />
      <line x1="235" y1="260" x2="265" y2="260" stroke="url(#glasses)" stroke-width="6" />
      <!-- Collar Accent -->
      <path d="M225 410 L250 450 L275 410" fill="none" stroke="#FACC15" stroke-width="4" stroke-linecap="round" />
    </g>
  </svg>