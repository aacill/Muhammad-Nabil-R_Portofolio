<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <rect width="100%" height="100%" fill="#18181B" />
    <defs>
      <pattern id="dotpattern" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.5" fill="#27272A" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#dotpattern)" />
    
    <!-- Central Stage Illustration -->
    <g transform="translate(60, 50)">
      <rect width="680" height="320" rx="12" fill="#09090B" stroke="#27272A" />
      <!-- Stage spotlight / projector -->
      <polygon points="100,0 240,320 0,320" fill="#FACC15" opacity="0.08" />
      <polygon points="580,0 680,320 440,320" fill="#38BDF8" opacity="0.08" />
      
      <!-- Stage screen banner -->
      <rect x="180" y="50" width="320" height="140" rx="8" fill="#18181B" stroke="#FACC15" stroke-width="1.5" />
      <text x="340" y="110" fill="#FACC15" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">DOKUMENTASI KEGIATAN</text>
      <text x="340" y="145" fill="#FAFAFA" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">Hacktoberfest Translation Lab</text>

      <!-- People silhouettes -->
      <circle cx="280" cy="240" r="18" fill="#71717A" />
      <path d="M250 300 C250 270 310 270 310 300 Z" fill="#71717A" />

      <circle cx="340" cy="230" r="22" fill="#FACC15" />
      <path d="M305 300 C305 260 375 260 375 300 Z" fill="#FACC15" />

      <circle cx="400" cy="240" r="18" fill="#71717A" />
      <path d="M370 300 C370 270 430 270 430 300 Z" fill="#71717A" />
    </g>
    
    <text x="60" y="420" fill="#FAFAFA" font-family="sans-serif" font-size="22" font-weight="700">Nusantara Open Source Initiative</text>
    <text x="60" y="450" fill="#FACC15" font-family="sans-serif" font-size="15" font-weight="600">Koordinator Lokalisasi</text>
  </svg>