<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
    <rect width="100%" height="100%" fill="#F8FAFC" />
    <!-- Top Navbar -->
    <rect width="1200" height="76" fill="#FFFFFF" />
    <line x1="0" y1="76" x2="1200" y2="76" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="72" cy="38" r="20" fill="#0F172A" />
    <text x="72" y="43" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">KAP</text>
    <text x="106" y="34" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="800">KANTOR AKUNTAN PUBLIK</text>
    <text x="106" y="52" fill="#475569" font-family="sans-serif" font-size="12" font-weight="600">Djoko Soerjadi &amp; Rekan</text>

    <text x="520" y="43" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="700">Beranda</text>
    <text x="610" y="43" fill="#475569" font-family="sans-serif" font-size="13" font-weight="500">Layanan Audit</text>
    <text x="730" y="43" fill="#475569" font-family="sans-serif" font-size="13" font-weight="500">Profil Partner</text>
    <text x="850" y="43" fill="#475569" font-family="sans-serif" font-size="13" font-weight="500">Regulasi</text>
    <rect x="980" y="18" width="150" height="40" rx="8" fill="#0F172A" />
    <text x="1055" y="43" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Konsultasi Audit</text>

    <!-- Hero Banner -->
    <rect x="60" y="110" width="1080" height="290" rx="20" fill="#0F172A" />
    <rect x="100" y="145" width="240" height="28" rx="14" fill="#1E293B" />
    <text x="220" y="164" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">IZIN RESMI KEMENKEU RI &amp; IAPI</text>
    <text x="100" y="218" fill="#FFFFFF" font-family="sans-serif" font-size="36" font-weight="800">Integritas &amp; Independensi dalam</text>
    <text x="100" y="262" fill="#38BDF8" font-family="sans-serif" font-size="36" font-weight="800">Layanan Audit Laporan Keuangan</text>
    <text x="100" y="302" fill="#94A3B8" font-family="sans-serif" font-size="15">Mitra akuntan publik terpercaya untuk jasa atestasi, audit umum, review keuangan, dan kepatuhan korporasi.</text>
    <rect x="100" y="330" width="185" height="44" rx="10" fill="#38BDF8" />
    <text x="192" y="357" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Jadwalkan Pertemuan</text>
    <rect x="300" y="330" width="170" height="44" rx="10" fill="none" stroke="#475569" stroke-width="1.5" />
    <text x="385" y="357" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Lihat Ruang Lingkup</text>

    <!-- Feature Cards -->
    <g transform="translate(60, 435)">
      <rect x="0" y="0" width="340" height="255" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="28" y="28" width="48" height="48" rx="12" fill="#EFF6FF" />
      <text x="52" y="58" fill="#0284C7" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">01</text>
      <text x="28" y="108" fill="#0F172A" font-family="sans-serif" font-size="19" font-weight="800">Audit Umum (General Audit)</text>
      <text x="28" y="138" fill="#475569" font-family="sans-serif" font-size="13">Pemeriksaan independen atas laporan</text>
      <text x="28" y="158" fill="#475569" font-family="sans-serif" font-size="13">keuangan sesuai Standar Profesional</text>
      <text x="28" y="178" fill="#475569" font-family="sans-serif" font-size="13">Akuntan Publik (SPAP) &amp; SAK.</text>

      <rect x="370" y="0" width="340" height="255" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="398" y="28" width="48" height="48" rx="12" fill="#EFF6FF" />
      <text x="422" y="58" fill="#0284C7" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">02</text>
      <text x="398" y="108" fill="#0F172A" font-family="sans-serif" font-size="19" font-weight="800">Jasa Atestasi &amp; Review</text>
      <text x="398" y="138" fill="#475569" font-family="sans-serif" font-size="13">Evaluasi kinerja keuangan, prosedur</text>
      <text x="398" y="158" fill="#475569" font-family="sans-serif" font-size="13">yang disepakati (AUP), serta uji</text>
      <text x="398" y="178" fill="#475569" font-family="sans-serif" font-size="13">tuntas keuangan (Due Diligence).</text>

      <rect x="740" y="0" width="340" height="255" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="768" y="28" width="48" height="48" rx="12" fill="#EFF6FF" />
      <text x="792" y="58" fill="#0284C7" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">03</text>
      <text x="768" y="108" fill="#0F172A" font-family="sans-serif" font-size="19" font-weight="800">Kepatuhan &amp; Tata Kelola</text>
      <text x="768" y="138" fill="#475569" font-family="sans-serif" font-size="13">Pendampingan tata kelola korporasi</text>
      <text x="768" y="158" fill="#475569" font-family="sans-serif" font-size="13">(GCG), pengendalian internal, serta</text>
      <text x="768" y="178" fill="#475569" font-family="sans-serif" font-size="13">konsultasi perpajakan terpadu.</text>
    </g>
  </svg>