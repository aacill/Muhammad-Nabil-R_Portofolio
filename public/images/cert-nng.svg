<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
    <!-- Outer Card -->
    <rect width="100%" height="100%" fill="#09090B" />
    <rect x="20" y="20" width="860" height="580" rx="16" fill="#18181B" stroke="#27272A" stroke-width="2" />
    
    <!-- Certificate Border Frame -->
    <rect x="40" y="40" width="820" height="540" rx="12" fill="none" stroke="#FACC15" stroke-width="2" stroke-dasharray="12 6" opacity="0.6" />
    
    <!-- Gold Badge Seal -->
    <g transform="translate(730, 110)">
      <circle cx="0" cy="0" r="45" fill="#FACC15" />
      <circle cx="0" cy="0" r="38" fill="#18181B" />
      <polygon points="0,-24 7,-8 24,-8 11,4 16,22 0,11 -16,22 -11,4 -24,-8 -7,-8" fill="#FACC15" />
      <path d="M-15 35 L-25 70 L0 55 L25 70 L15 35 Z" fill="#FACC15" opacity="0.9" />
    </g>
    
    <!-- Certificate Texts -->
    <text x="80" y="110" fill="#FACC15" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="3">SERTIFIKASI PROFESIONAL RESMI</text>
    <text x="80" y="180" fill="#FAFAFA" font-family="sans-serif" font-size="34" font-weight="800">UX Certification: Interaction Design</text>
    
    <text x="80" y="240" fill="#A1A1AA" font-family="sans-serif" font-size="16">Diberikan secara sah kepada:</text>
    <text x="80" y="285" fill="#FAFAFA" font-family="sans-serif" font-size="28" font-weight="700">Rian Pratama</text>
    
    <line x1="80" y1="315" x2="400" y2="315" stroke="#FACC15" stroke-width="2" />
    
    <text x="80" y="360" fill="#A1A1AA" font-family="sans-serif" font-size="15">Lembaga Penerbit / Penyelenggara:</text>
    <text x="80" y="395" fill="#E4E4E7" font-family="sans-serif" font-size="20" font-weight="600">Nielsen Norman Group</text>
    
    <!-- Footer Credentials -->
    <g transform="translate(80, 480)">
      <rect width="740" height="70" rx="8" fill="#09090B" stroke="#27272A" />
      <text x="30" y="32" fill="#71717A" font-family="sans-serif" font-size="12">TANGGAL TERBIT</text>
      <text x="30" y="52" fill="#FAFAFA" font-family="sans-serif" font-size="14" font-weight="600">20 November 2023</text>
      
      <text x="260" y="32" fill="#71717A" font-family="sans-serif" font-size="12">ID KREDENSIAL</text>
      <text x="260" y="52" fill="#FACC15" font-family="monospace" font-size="14" font-weight="600">NNG-UXC-109482</text>

      <text x="540" y="32" fill="#71717A" font-family="sans-serif" font-size="12">STATUS VERIFIKASI</text>
      <text x="540" y="52" fill="#34D399" font-family="sans-serif" font-size="14" font-weight="600">✓ TERVERIFIKASI RESMI</text>
    </g>
  </svg>