<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <rect width="100%" height="100%" fill="#18181B" />
    <!-- Grid Pattern -->
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272A" stroke-width="1" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)" />
    
    <!-- Accent Bar -->
    <rect x="48" y="48" width="6" height="50" fill="#34D399" rx="3" />
    
    <!-- Tag -->
    <rect x="66" y="52" width="140" height="30" rx="15" fill="#27272A" />
    <text x="136" y="72" fill="#FAFAFA" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">MOBILE APP</text>

    <!-- Center Graphic / Layout Preview -->
    <g transform="translate(60, 130)">
      <rect width="680" height="260" rx="12" fill="#09090B" stroke="#27272A" stroke-width="2" />
      <!-- Window header -->
      <circle cx="30" cy="24" r="6" fill="#EF4444" />
      <circle cx="48" cy="24" r="6" fill="#FACC15" />
      <circle cx="66" cy="24" r="6" fill="#10B981" />
      <line x1="0" y1="48" x2="680" y2="48" stroke="#27272A" stroke-width="1.5" />
      
      <!-- Content preview blocks -->
      <rect x="30" y="76" width="220" height="18" rx="4" fill="#34D399" opacity="0.8" />
      <rect x="30" y="106" width="380" height="12" rx="3" fill="#3F3F46" />
      <rect x="30" y="126" width="320" height="12" rx="3" fill="#3F3F46" />
      
      <rect x="30" y="160" width="180" height="70" rx="8" fill="#18181B" stroke="#27272A" />
      <rect x="230" y="160" width="180" height="70" rx="8" fill="#18181B" stroke="#27272A" />
      <rect x="430" y="160" width="220" height="70" rx="8" fill="#18181B" stroke="#27272A" />
      
      <!-- Small metric bars -->
      <rect x="50" y="180" width="80" height="10" rx="3" fill="#71717A" />
      <rect x="50" y="200" width="140" height="16" rx="4" fill="#34D399" />

      <rect x="250" y="180" width="80" height="10" rx="3" fill="#71717A" />
      <rect x="250" y="200" width="120" height="16" rx="4" fill="#38BDF8" />

      <rect x="450" y="180" width="80" height="10" rx="3" fill="#71717A" />
      <rect x="450" y="200" width="160" height="16" rx="4" fill="#34D399" />
    </g>

    <!-- Bottom info -->
    <text x="60" y="445" fill="#FAFAFA" font-family="sans-serif" font-size="24" font-weight="700">Zenith Tracker Mobile</text>
    <text x="60" y="475" fill="#A1A1AA" font-family="sans-serif" font-size="14">Offline-first Habit Architecture</text>
  </svg>