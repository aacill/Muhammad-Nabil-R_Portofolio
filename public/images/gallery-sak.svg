      <circle cx="48" cy="24" r="6" fill="#FACC15" />
      <circle cx="66" cy="24" r="6" fill="#10B981" />
      <line x1="0" y1="48" x2="680" y2="48" stroke="#27272A" stroke-width="1.5" />
      
      <!-- Nav & Header bar -->
      <rect x="30" y="70" width="160" height="18" rx="4" fill="#FACC15" />
      <rect x="30" y="100" width="340" height="12" rx="3" fill="#71717A" />
      <rect x="30" y="120" width="280" height="12" rx="3" fill="#3F3F46" />
      
      <!-- Financial Service Blocks -->
      <rect x="30" y="160" width="190" height="80" rx="8" fill="#18181B" stroke="#27272A" />
      <rect x="245" y="160" width="190" height="80" rx="8" fill="#18181B" stroke="#27272A" />
      <rect x="460" y="160" width="190" height="80" rx="8" fill="#18181B" stroke="#27272A" />
      
      <text x="50" y="195" fill="#FAFAFA" font-family="sans-serif" font-size="13" font-weight="700">Jasa Pembukuan</text>
      <rect x="50" y="210" width="120" height="8" rx="2" fill="#71717A" />

      <text x="265" y="195" fill="#FAFAFA" font-family="sans-serif" font-size="13" font-weight="700">Laporan Keuangan</text>
      <rect x="265" y="210" width="120" height="8" rx="2" fill="#71717A" />

