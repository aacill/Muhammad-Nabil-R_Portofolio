<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <rect width="100%" height="100%" fill="#18181B" />
    <defs>
      <pattern id="grid-sak" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272A" stroke-width="1" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid-sak)" />
    
    <rect x="48" y="48" width="6" height="50" fill="#FACC15" rx="3" />
